name: CloudOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
         contents: read
         packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudops-app .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Tag Docker image
        run: docker tag cloudops-app ghcr.io/ayushkasingh/cloudops-platform:latest

      - name: Push Docker image
        run: docker push ghcr.io/ayushkasingh/cloudops-platform:latest